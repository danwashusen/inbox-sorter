[project]
name = "inbox-sorter"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "huggingface-hub>=2.2.0",
    "pillow>=13.0.0",
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.1",
]

[build-system]
requires = ["uv_build>=0.8.16,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
